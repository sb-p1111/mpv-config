# Chapter navigation
'              no-osd add chapter -1; script-binding uosc/flash-timeline
ENTER          no-osd add chapter  1; script-binding uosc/flash-timeline

# Playback
MBTN_RIGHT     cycle pause
m              no-osd cycle mute; script-binding uosc/flash-volume
<              script-binding uosc/prev-file
>              script-binding uosc/next-file
/              seek  85
LEFT           seek -10
RIGHT          seek  10

# Speed
[              no-osd add speed -0.25; script-binding uosc/flash-speed
]              no-osd add speed  0.25; script-binding uosc/flash-speed
BS             no-osd set speed 1; script-binding uosc/flash-speed

# Volume
UP             no-osd add volume  5; script-binding uosc/flash-volume
DOWN           no-osd add volume -5; script-binding uosc/flash-volume

# uosc
DEL            script-binding uosc/toggle-ui
g-a            script-binding uosc/audio
g-c            script-binding uosc/chapters
g-d            script-binding uosc/audio-device
g-e            script-binding uosc/editions
g-m            script-binding uosc/menu
g-o            script-binding uosc/open-file
g-p            script-binding uosc/playlist
g-s            script-binding uosc/subtitles
g-v            script-binding uosc/video
Ctrl+p         script-binding uosc/menu
Shift+F10      script-binding uosc/menu

# Mouse wheel
WHEEL_UP       ignore
WHEEL_DOWN     ignore
WHEEL_LEFT     ignore
WHEEL_RIGHT    ignore