# General
border=no
fullscreen=yes
save-position-on-quit=yes
autocreate-playlist=same
directory-mode=ignore

# Video
hwdec=auto
cscale=bilinear

# OSD
osd-bar=no
osd-font="Inter Regular"

# Subtitles
alang=ja,jpn
slang=en,eng
sub-auto=fuzzy
sub-font="Gandhi Sans"
sub-font-size=48
sub-bold=yes
sub-margin-y=47
sub-outline-size=2.4
sub-shadow-offset=0.75

# Screenshots
screenshot-dir="D:/Images/Screenshots/mpv"
screenshot-template="%F [%wH.%wM.%wS]"
screenshot-format=webp
screenshot-webp-quality=95
screenshot-webp-compression=6