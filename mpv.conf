# == Video / Rendering ==
vo=gpu-next
hwdec=auto

# == OSD ==
osd-bar=no
osd-font="Segoe UI Variable"

# == Audio / Subtitle Language & Loading ==
alang=jpn,jp
slang=en,eng
sub-auto=fuzzy

# == Subtitle Appearance ==
sub-font="Gandhi Sans"
sub-bold=yes
sub-font-size=48
sub-margin-y=47
sub-outline-size=2.4
sub-shadow-offset=0.8

# == Screenshots ==
screenshot-format=webp
screenshot-webp-quality=95
screenshot-webp-compression=6
screenshot-template="%F [%wH.%wM.%wS]"
screenshot-dir="D:\Images\Screenshots\mpv"

# == Window Behavior ==
fullscreen
ontop
autofit=80%x80%

# == Playback / Playlist ==
autocreate-playlist=same
directory-mode=ignore
save-position-on-quit