# ==============================================================================
# VIDEO & DISPLAY
# ==============================================================================
hwdec=auto                      # Enable hardware decoding
fs                              # Start in fullscreen mode
autofit=50%x50%                 # Set initial window size relative to screen size

# ==============================================================================
# ON-SCREEN DISPLAY (OSD)
# ==============================================================================
osd-bar=no                      # Disable volume/seek bar overlay
osd-font="Segoe UI Variable"    # Font for OSD text messages

# ==============================================================================
# AUDIO & SUBTITLES
# ==============================================================================
alang=jpn,jp                    # Preferred audio languages (Japanese)
slang=enm,eng                   # Preferred subtitle languages (English)

sub-font="Gandhi Sans"          # Subtitle font
sub-bold=yes                    # Bold text for subtitles
sub-font-size=48                # Subtitle font size
sub-margin-y=47                 # Bottom margin distance
sub-outline-size=2.4            # Outline thickness
sub-shadow-offset=0.8           # Shadow distance

# ==============================================================================
# SCREENSHOTS
# ==============================================================================
screenshot-format=webp
screenshot-webp-compression=6
screenshot-webp-quality=95
screenshot-template="%F [%wH.%wM.%wS]"
screenshot-dir="D:\Images\mpv"

# ==============================================================================
# CACHE, PLAYLIST & BEHAVIOR
# ==============================================================================
cache=no                        # Disable disk cache
save-position-on-quit           # Resume playback position on restart
autocreate-playlist=same        # Load files from the same directory into playlist
directory-mode=ignore           # Ignore subdirectories when loading folders