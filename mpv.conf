# Video
hwdec=auto
cscale=bilinear

# Window
fullscreen=yes
osd-bar=no
osd-font="Adwaita Sans"

# Language
alang=ja,jpn
slang=en,eng

# Subtitles
sub-auto=fuzzy
sub-font="Gandhi Sans"
sub-bold=yes
sub-font-size=48
sub-margin-y=47
sub-outline-size=2.4
sub-shadow-offset=0.8

# Screenshots
screenshot-format=webp
screenshot-webp-compression=6
screenshot-webp-quality=95
screenshot-template="%F [%wH.%wM.%wS]"
screenshot-dir="~/Pictures/Screenshots/mpv"

# Playlist & resume
autocreate-playlist=same
directory-mode=ignore
save-position-on-quit=yes
