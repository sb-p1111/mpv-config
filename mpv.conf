# --- Video ---
vo=gpu-next
hwdec=auto-safe
fs=yes
autofit=90%x90%

# --- OSD ---
osd-bar=no
osd-font="Maple Mono"
border=no

# --- Audio & Subtitle ---
alang=jpn,jp
slang=en,eng
sub-auto=fuzzy

sub-font="Gandhi Sans"
sub-bold=yes
sub-font-size=48
sub-margin-y=47
sub-outline-size=2.4
sub-shadow-offset=0.8

# --- Screenshot ---
screenshot-format=jxl
screenshot-jxl-distance=1.0
screenshot-jxl-effort=7
screenshot-template="%F [%wH.%wM.%wS]"
screenshot-dir="D:\02 Images\01 Screenshots\01 mpv"

# --- Behaviour ---
save-position-on-quit
keep-open=yes
autocreate-playlist=same
directory-mode=ignore