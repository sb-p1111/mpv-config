# Seeking         
left        seek -8
right       seek 8
/           seek 85

# Speed
[           add speed -0.25
]           add speed 0.25          

# Volume
up          add volume 10
down        add volume -10

# Chapters
'           add chapter -1
enter       add chapter 1

# Disabled           
wheel_up    ignore
wheel_down  ignore
wheel_left  ignore
wheel_right ignore