# Playback
k           cycle pause
mbtn_right  script-binding uosc/menu

# Seeking
j           seek -10
l           seek 10
left        seek -5
right       seek 5
tab         seek 85

# Speed
[           no-osd add speed -0.25; script-binding uosc/flash-speed
]           no-osd add speed 0.25; script-binding uosc/flash-speed
bs          no-osd set speed 1; script-binding uosc/flash-speed

# Volume
m           no-osd cycle mute; script-binding uosc/flash-volume
up          no-osd add volume 10; script-binding uosc/flash-volume
down        no-osd add volume -10; script-binding uosc/flash-volume

# Chapters
'           add chapter -1
enter       add chapter 1
c           script-binding uosc/chapters

# Playlist & files
<           script-binding uosc/prev
>           script-binding uosc/next
o           script-binding uosc/open-file
p           script-binding uosc/playlist

# Tracks
a           script-binding uosc/audio
s           script-binding uosc/subtitles

# Screenshot
ctrl+s      async screenshot

# Disabled
!           ignore
@           ignore
9           ignore
0           ignore
/           ignore
wheel_up    ignore
wheel_down  ignore
wheel_left  ignore
wheel_right ignore