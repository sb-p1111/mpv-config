# ==============================================================================
# NAVIGATION & PLAYBACK
# ==============================================================================
k            cycle pause               # Toggle play/pause
j            seek -10                  # Seek backward 10 seconds
l            seek 10                   # Seek forward 10 seconds
TAB          seek 85                   # Jump forward 85 seconds (skip anime OP/ED)
[            add speed -0.25           # Decrease playback speed
]            add speed 0.25            # Increase playback speed

# ==============================================================================
# CHAPTERS & PLAYLIST
# ==============================================================================
ENTER        add chapter 1             # Skip to next chapter
p            playlist-prev             # Play previous item in playlist
n            playlist-next             # Play next item in playlist

# ==============================================================================
# TRACKS & SCREENSHOTS
# ==============================================================================
a            cycle audio               # Cycle audio tracks
s            cycle sub                 # Cycle subtitle tracks
ctrl+s       async screenshot          # Take non-blocking screenshot