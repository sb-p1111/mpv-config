# --- Playback ---
k               cycle pause
mbtn_right      cycle pause

# --- Seek ---
j               seek -10
l               seek 10
left            seek -5
right           seek 5
tab             seek 85

# --- Speed ---
[               add speed -0.25
]               add speed 0.25

# --- Volume ---
up              add volume 5
down            add volume -5

# --- Chapter ---
'               add chapter -1
enter           add chapter 1
c               script-binding select/select-chapter

# --- Playlist ---
<               playlist-prev
>               playlist-next
p               script-binding select/select-playlist

# --- Subtitle and Audio ---
s               script-binding select/select-sid
a               script-binding select/select-aid

# --- Screenshot ---
ctrl+s          async screenshot

# --- Ignore ---
!               ignore
@               ignore
9               ignore
0               ignore
wheel_up        ignore
wheel_down      ignore
wheel_left      ignore
wheel_right     ignore
